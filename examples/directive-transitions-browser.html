<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SibuJS when()/match() transitions — browser test fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; }
      @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
      @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
      /* Shorthands on purpose: the leave timing is read from computed styles. */
      .out { animation: fade 200ms ease forwards; }
      .in { animation: rise 150ms ease; }
      .slide-out { transition: opacity 200ms ease, transform 300ms ease 50ms; opacity: 0; transform: translateX(20px); }
      /* Longhands: ONE duration shared by two properties with different delays. */
      .panel-x { opacity: 1; transform: none; }
      .longhand-out {
        transition-property: opacity, transform;
        transition-duration: 200ms;
        transition-delay: 0ms, 500ms;
        opacity: 0;
        transform: translateX(20px);
      }
      /* Long enough for a test to interact with the leaving rows under load (the cap is 5 s). */
      /* `color` is listed with a long duration but never changes: nothing waits for it. */
      .noop-out { transition-property: opacity, color; transition-duration: 200ms, 3s; opacity: 0; }
      .late-out { animation: fade 1200ms linear forwards; }
      .row-in { animation: rise 300ms ease; }
      .slow-out { animation: fade 4500ms linear forwards; }
      @media (prefers-reduced-motion: reduce) {
        .out, .in { animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="when-host"></div>
      <div id="transition-host"></div>
      <div id="fragment-host"></div>
      <div id="longhand-host"></div>
      <div id="rows-host"></div>
      <div id="noop-host"></div>
      <div id="late-host"></div>
      <div id="enter-host"></div>
      <div id="suspense-host"></div>
      <div id="nested-host"></div>
      <div id="reclaim-host"></div>
      <button id="after-rows">after</button>
    </main>
    <script type="module">
      import { Fragment, button, div, each, input, onUnmount, registerDisposer, signal, span, when } from "../dist/index.js";
      import { Suspense } from "../dist/plugins.js";

      const unmounted = [];

      // A `when` with a CSS-animation leave and a focusable field in each branch.
      const [on, setOn] = signal(true);
      const panel = (name) => {
        const el = div({ class: "panel", "data-name": name }, [input({ id: "field", "data-branch": name })]);
        onUnmount(() => unmounted.push({ name, at: performance.now() }), el);
        return el;
      };
      document.getElementById("when-host").appendChild(
        when(() => on(), () => panel("A"), () => panel("B"), { transition: { leaveClass: "out", enterClass: "in" } }),
      );

      // A CSS-transition leave with two properties and a delay.
      const [slid, setSlid] = signal(true);
      document.getElementById("transition-host").appendChild(
        when(() => slid(), () => span({ class: "slider" }, "slide"), { transition: { leaveClass: "slide-out" } }),
      );

      // A multi-node branch.
      const [pair, setPair] = signal(true);
      document.getElementById("fragment-host").appendChild(
        when(
          () => pair(),
          () => Fragment([button({ "data-pair": "yes" }, "Yes"), button({ "data-pair": "no" }, "No")]),
          () => span({ "data-pair": "none" }, "none"),
          { transition: { leaveClass: "out" } },
        ),
      );

      // CSS longhands: the leave must outlast the delayed transform.
      const longhand = { unmountedAt: 0, ends: [] };
      const [lh, setLh] = signal(true);
      document.getElementById("longhand-host").appendChild(
        when(
          () => lh(),
          () => {
            const el = div({ class: "panel-x", "data-longhand": "" }, "longhand");
            el.addEventListener("transitionend", (e) =>
              longhand.ends.push({ property: e.propertyName, at: performance.now(), connected: el.isConnected }),
            );
            onUnmount(() => {
              longhand.unmountedAt = performance.now();
            }, el);
            return el;
          },
          { transition: { leaveClass: "longhand-out" } },
        ),
      );

      // A fragment branch whose rows come from each(): rendered after insertion.
      const clicks = [];
      const rowFocus = [];
      document.addEventListener("focusin", (e) => {
        const row = e.target instanceof Element ? e.target.getAttribute("data-row") : null;
        if (row !== null) rowFocus.push(row);
      });
      const [rowsOn, setRowsOn] = signal(true);
      const [rows] = signal([1, 2]);
      document.getElementById("rows-host").appendChild(
        when(
          () => rowsOn(),
          () =>
            Fragment([
              span("rows:"),
              each(rows, (item) => button({ "data-row": String(item()), on: { click: () => clicks.push(item()) } }, `row ${item()}`), {
                key: (item) => item,
              }),
            ]),
          { transition: { leaveClass: "slow-out" } },
        ),
      );

      // A listed property that never changes must not hold the leave.
      const noop = { unmountedAt: 0 };
      const [noopOn, setNoopOn] = signal(true);
      document.getElementById("noop-host").appendChild(
        when(
          () => noopOn(),
          () => {
            const el = div({ class: "panel-x", "data-noop": "" }, "noop");
            onUnmount(() => {
              noop.unmountedAt = performance.now();
            }, el);
            return el;
          },
          { transition: { leaveClass: "noop-out" } },
        ),
      );

      // A caller-owned list whose row arrives partway through the leave.
      const late = { hidden: 0, added: 0, stillLeaving: false, removed: {}, ends: {} };
      const [lateOn, setLateOn] = signal(true);
      const [lateItems, setLateItems] = signal([1]);
      const lateHost = document.getElementById("late-host");
      const lateFragment = Fragment([
        each(lateItems, (item) => button({ "data-late": String(item.peek()) }, `late ${item.peek()}`), {
          key: (item) => item,
        }),
      ]);
      lateHost.appendChild(when(() => lateOn(), lateFragment, { transition: { leaveClass: "late-out" } }));
      lateHost.addEventListener("animationend", (e) => {
        late.ends[e.target.dataset.late] = performance.now();
      }, true);
      new MutationObserver((records) => {
        for (const r of records)
          for (const n of r.removedNodes) if (n.dataset?.late) late.removed[n.dataset.late] ??= performance.now();
      }).observe(lateHost, { childList: true });

      // A branch whose rows come from a top-level each(): they enter with it.
      const entered = [];
      const [enterOn, setEnterOn] = signal(false);
      const [enterItems] = signal([1, 2]);
      const enterHost = document.getElementById("enter-host");
      enterHost.addEventListener("animationstart", (e) => {
        if (e.target.dataset?.enter) entered.push({ row: e.target.dataset.enter, name: e.animationName });
      }, true);
      enterHost.appendChild(
        when(
          () => enterOn(),
          () =>
            Fragment([
              each(enterItems, (item) => span({ "data-enter": String(item.peek()) }, `row ${item.peek()}`), {
                key: (item) => item,
              }),
            ]),
          { transition: { enterClass: "row-in" } },
        ),
      );

      // Suspense whose content resolves while its branch is leaving.
      const susp = { loadedSeen: false, fallbackCleanups: 0, removedAt: 0 };
      let resolveContent;
      const [suspOn, setSuspOn] = signal(true);
      const suspHost = document.getElementById("suspense-host");
      suspHost.appendChild(
        when(
          () => suspOn(),
          () =>
            div({ "data-susp": "" }, [
              Suspense({
                nodes: () => new Promise((r) => (resolveContent = r)),
                fallback: () => {
                  const f = span({ "data-fallback": "" }, "loading");
                  registerDisposer(f, () => susp.fallbackCleanups++);
                  return f;
                },
              }),
            ]),
          { transition: { leaveClass: "slow-out" } },
        ),
      );
      new MutationObserver((records) => {
        for (const r of records) {
          for (const n of r.addedNodes) if (n.dataset?.loaded !== undefined) susp.loadedSeen = true;
          for (const n of r.removedNodes) if (n.dataset?.susp !== undefined) susp.removedAt = performance.now();
        }
      }).observe(suspHost, { childList: true, subtree: true });

      // A nested pending enter whose ancestor freezes before it starts.
      const nestedEntered = [];
      const [selected, setSelected] = signal(null);
      const [nestedItems] = signal([1]);
      document.getElementById("nested-host").appendChild(
        when(
          () => selected(),
          () =>
            div({ "data-nested": "" }, [
              when(
                () => true,
                () =>
                  Fragment([
                    span("heading"),
                    each(nestedItems, (item) => span(String(item.peek())), { key: (item) => item }),
                  ]),
                { transition: { appear: true, enter: () => nestedEntered.push(selected()?.name ?? "invalid") } },
              ),
            ]),
          { transition: { leaveClass: "slow-out" } },
        ),
      );

      // A branch taken back while it leaves, with a Suspense that resolves
      // while it is paused.
      const reclaim = { nodesCalls: 0 };
      let resolveReclaim;
      let reclaimShared = null;
      const [reclaimOn, setReclaimOn] = signal(true);
      document.getElementById("reclaim-host").appendChild(
        when(
          () => reclaimOn(),
          () =>
            (reclaimShared ??= div({ "data-reclaim": "" }, [
              Suspense({
                nodes: () => {
                  reclaim.nodesCalls++;
                  return new Promise((r) => (resolveReclaim = r));
                },
                fallback: () => span("waiting"),
              }),
            ])),
          () => span({ "data-reclaim-off": "" }, "off"),
          { transition: { leaveClass: "slow-out" } },
        ),
      );

      window.__t = {
        reclaimHide: () => setReclaimOn(false),
        reclaimShow: () => setReclaimOn(true),
        reclaimResolve: () => resolveReclaim(span({ "data-reclaimed": "" }, "content")),
        reclaimLog: () => ({ ...reclaim }),
        suspHide: () => setSuspOn(false),
        suspResolve: () => resolveContent(span({ "data-loaded": "" }, "loaded")),
        suspLog: () => ({ ...susp, text: suspHost.textContent }),
        nestedSelectThenClear: () => {
          setSelected({ name: "Ada" });
          queueMicrotask(() => setSelected(null));
        },
        nestedSelect: () => setSelected({ name: "Ada" }),
        nestedEntered: () => nestedEntered.slice(),
        // Hide, then add the row 300 ms into the leave, timed inside the page.
        hideThenAddLate: () => {
          late.hidden = performance.now();
          setLateOn(false);
          setTimeout(() => {
            late.added = performance.now();
            late.stillLeaving = document.querySelector('[data-late="1"]') !== null;
            setLateItems([1, 2]);
          }, 300);
        },
        lateLog: () => JSON.parse(JSON.stringify(late)),
        showEnter: () => setEnterOn(true),
        entered: () => entered.slice(),
        noop: () => {
          const switchedAt = performance.now();
          setNoopOn(false);
          return switchedAt;
        },
        noopUnmountedAt: () => noop.unmountedAt,
        longhand: () => {
          const switchedAt = performance.now();
          setLh(false);
          return switchedAt;
        },
        longhandLog: () => ({ ...longhand, ends: longhand.ends.slice() }),
        hideRows: () => setRowsOn(false),
        clicks: () => clicks.slice(),
        rowFocus: () => rowFocus.slice(),
        toggle: () => {
          const switchedAt = performance.now();
          setOn(!on());
          return switchedAt;
        },
        slide: () => {
          const switchedAt = performance.now();
          setSlid(!slid());
          return switchedAt;
        },
        pair: () => setPair(!pair()),
        unmounted: () => unmounted.slice(),
        panels: () =>
          Array.from(document.querySelectorAll("#when-host .panel")).map((el) => ({
            name: el.dataset.name,
            inert: el.hasAttribute("inert"),
            hidden: el.getAttribute("aria-hidden"),
            leaving: el.classList.contains("out"),
          })),
        focused: () => document.activeElement?.dataset?.branch ?? document.activeElement?.tagName ?? null,
      };
      window.__ready = true;
    </script>
  </body>
</html>
