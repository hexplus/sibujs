<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SibuJS Router — browser test fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; }
      #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; }
      nav a { margin-right: 8px; }
    </style>
  </head>
  <body>
    <nav id="nav"></nav>

    <nav id="plain-nav">
      <a id="plain-link" href="/users">Plain anchor (NOT intercepted by design)</a>
    </nav>

    <main>
      <div id="outlet"></div>
      <input id="focus-input" type="text" />
    </main>

    <div id="log"></div>

    <script type="module">
      import {
        createRouter,
        setRoutes,
        Route,
        RouterLink,
        route,
        navigate,
        replace,
      } from "../dist/plugins.js";

      const HOME = "/examples/router-browser.html";
      const events = [];
      const log = (msg) => {
        events.push(msg);
        document.getElementById("log").textContent = events.join("\n");
      };

      const page = (name) => () => {
        const d = document.createElement("div");
        d.className = "page";
        d.dataset.page = name;
        d.textContent = `page:${name}`;
        return d;
      };

      createRouter({ mode: "history", base: "" });
      setRoutes([
        { path: HOME, component: page("home") },
        { path: "/user", component: page("user") },
        { path: "/user/:id", component: page("user-detail-singular") },
        { path: "/users", component: page("users") },
        { path: "/users/:id", component: page("user-detail") },
        { path: "/about", component: page("about") },
        { path: "*", component: page("not-found") },
      ]);

      document.getElementById("outlet").appendChild(Route());

      // ---- Links under test -------------------------------------------------
      const nav = document.getElementById("nav");

      const add = (el, id) => {
        el.id = id;
        nav.appendChild(el);
        return el;
      };

      add(RouterLink({ to: HOME, nodes: "Home" }), "link-home");
      add(RouterLink({ to: "/about", nodes: "About" }), "link-about");
      add(RouterLink({ to: "/about#section", nodes: "About hash" }), "link-hash");
      add(RouterLink({ to: "/about", target: "_blank", nodes: "About (new tab)" }), "link-blank");

      // Nested element inside the anchor — clicking the span must still resolve
      // the anchor and navigate.
      const nested = document.createElement("span");
      nested.className = "label";
      nested.textContent = "Users";
      add(RouterLink({ to: "/users", nodes: nested }), "link-users");

      // ---- Target-policy links (NAV-001) ------------------------------------
      // External absolute URL: RouterLink must NOT intercept it; the browser's
      // own navigation is left intact.
      add(RouterLink({ to: "https://example.com/", nodes: "External" }), "link-external");
      // Protocol-relative and dangerous schemes must never yield a live href.
      add(RouterLink({ to: "//example.com/path", nodes: "Proto-relative" }), "link-proto-relative");
      add(RouterLink({ to: "javascript:window.__pwned = true", nodes: "JS" }), "link-js");
      add(RouterLink({ to: "data:text/html,<script>window.__pwned=true<\/script>", nodes: "Data" }), "link-data");
      add(RouterLink({ to: "vbscript:msgbox(1)", nodes: "VB" }), "link-vbscript");

      // ---- Active-matching links (LINK-001 / LINK-002) ----------------------
      add(RouterLink({ to: "/user", nodes: "User (singular)" }), "link-match-user");
      add(RouterLink({ to: "/users", nodes: "Users (plural)" }), "link-match-users");
      add(RouterLink({ to: "/", nodes: "Root" }), "link-match-root");
      add(RouterLink({ to: "/about?q=a", nodes: "Query A" }), "link-query-a");
      add(RouterLink({ to: "/about#one", nodes: "Hash one" }), "link-hash-one");

      // App code prevents the default before the router's own listener runs.
      const prevented = add(RouterLink({ to: "/users", nodes: "Prevented" }), "link-prevented");
      prevented.addEventListener(
        "click",
        (e) => {
          e.preventDefault();
          log("prevented-handler-ran");
        },
        // Capture phase so this runs BEFORE the router's bubble-phase listener.
        true,
      );

      // ---- Click instrumentation --------------------------------------------
      // Records, for every click that reaches the document, whether anything
      // upstream cancelled it. The router's own anchor listener runs in the
      // bubble phase *before* this one, so `defaultPrevented` here is exactly
      // "did RouterLink intercept this click?".
      //
      // The trailing preventDefault() keeps the test on-origin — the external
      // link would otherwise really leave the page. It is deliberately scoped
      // to that one link so it cannot alter the native behaviour the existing
      // `target="_blank"` / modifier-click tests depend on, and it runs after
      // the reading, so it cannot affect what was measured.
      const clicks = [];
      document.addEventListener("click", (e) => {
        const anchor = e.target.closest ? e.target.closest("a") : null;
        clicks.push({
          id: anchor ? anchor.id : null,
          href: anchor ? anchor.getAttribute("href") : null,
          intercepted: e.defaultPrevented,
        });
        if (anchor && anchor.id === "link-external") e.preventDefault();
      });

      // ---- Test hooks -------------------------------------------------------
      window.__router = {
        clicks,
        lastClick: () => clicks[clicks.length - 1] || null,
        clearClicks: () => {
          clicks.length = 0;
        },
        classOf: (id) => document.getElementById(id).className,
        path: () => route().path,
        params: () => route().params,
        hash: () => route().hash,
        query: () => route().query,
        navigate: (to) => navigate(to),
        replace: (to) => replace(to),
        events,
        reset: () => {
          events.length = 0;
          document.getElementById("log").textContent = "";
        },
      };

      window.__ready = true;
      log("ready");
    </script>
  </body>
</html>
